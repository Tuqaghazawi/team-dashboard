<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Team Dashboard</title>
  <style>
    :root { --teal: #028090; --ink: #13343b; --muted: #5b7b7a; --line: #cfe0de; --bg: #f4f8f7; }
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: var(--bg);
           color: var(--ink); display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .card { background: #fff; width: 360px; max-width: 92vw; padding: 32px; border-radius: 10px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.10); }
    h1 { margin: 0 0 2px; font-size: 22px; color: var(--teal); }
    .sub { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input[type=text], input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
            border-radius: 6px; font-size: 15px; }
    input:focus { outline: none; border-color: var(--teal); }
    button { width: 100%; margin-top: 22px; padding: 11px; background: var(--teal); color: #fff;
             border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #026b78; }
    .error { background: #fdecea; color: #b3261e; padding: 10px 12px; border-radius: 6px;
             font-size: 13px; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Team Dashboard</h1>
    <p class="sub">Sign in to continue</p>

    {% if form.errors %}
    <p class="error">That username and password don't match. Please try again.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label for="id_username">Username</label>
      {{ form.username }}
      <label for="id_password">Password</label>
      {{ form.password }}
      <button type="submit">Sign in</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </div>
</body>
</html>
